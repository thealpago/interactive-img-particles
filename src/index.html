<!DOCTYPE html>
<html lang="en" class="no-js">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
	<title>Interactive Particles</title>
	<meta name="description"
		content="Demo of a tutorial on how to draw a large number of particles with Three.js and make them interactive." />
	<meta name="keywords" content="three.js, tutorial, particles, interactive, javascript, webgl" />
	<meta name="author" content="Bruno Imbrizi" />
	<link rel="shortcut icon" href="favicon.ico">
	<link rel="stylesheet" type="text/css" href="css/base.css" />
	<link rel="stylesheet" type="text/css" href="css/demo1.css" />
	<link rel="stylesheet" type="text/css" href="css/custom-gui.css" />
	<link rel="stylesheet" type="text/css" href="css/mobile-styles.css" />
	<link rel="stylesheet" type="text/css" href="css/controls.css" />
	<script>document.documentElement.className = "js"; var supportsCssVars = function () { var e, t = document.createElement("style"); return t.innerHTML = "root: { --tmp-var: bold; }", document.head.appendChild(t), e = !!(window.CSS && window.CSS.supports && window.CSS.supports("font-weight", "var(--tmp-var)")), t.parentNode.removeChild(t), e }; supportsCssVars() || alert("Please view this demo in a modern browser that supports CSS Variables.");</script>
</head>

<body class="demo-1">
	<main>
		<div class="frame">
			<!-- Content removed -->
		</div>
		<button id="gui-toggle" class="gui-toggle">
			<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
				stroke-linecap="round" stroke-linejoin="round">
				<line x1="3" y1="12" x2="21" y2="12"></line>
				<line x1="3" y1="6" x2="21" y2="6"></line>
				<line x1="3" y1="18" x2="21" y2="18"></line>
			</svg>
		</button>
		<div id="custom-gui" class="glass-menu">
			<h3>Settings</h3>
			<div class="gui-group">
				<label>Touch Radius</label>
				<input type="range" id="touchRadius" min="0" max="0.5" step="0.01" value="0.15">
			</div>
			<div class="gui-group">
				<label>Particles Random</label>
				<input type="range" id="particlesRandom" min="1" max="10" step="0.1" value="2">
			</div>
			<div class="gui-group">
				<label>Particles Depth</label>
				<input type="range" id="particlesDepth" min="1" max="10" step="0.1" value="4">
			</div>
			<div class="gui-group">
				<label>Particles Size</label>
				<input type="range" id="particlesSize" min="0" max="3" step="0.1" value="1.5">
			</div>
		</div>
		<div class="photo-controls-container">
			<button id="prev-btn" class="nav-arrow">
				<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
					stroke-linecap="round" stroke-linejoin="round">
					<polyline points="15 18 9 12 15 6"></polyline>
				</svg>
			</button>
			<div id="photo-title" class="photo-title"></div>
			<button id="next-btn" class="nav-arrow">
				<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
					stroke-linecap="round" stroke-linejoin="round">
					<polyline points="9 18 15 12 9 6"></polyline>
				</svg>
			</button>
		</div>
		<div id="photo-nav" class="photo-nav"></div>
	</main>
	<div class="container"></div>
</body>

</html>
